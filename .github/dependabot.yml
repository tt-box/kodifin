version: 2

updates:
  # Dépendances Gradle (catalogue gradle/libs.versions.toml, plugins et wrapper).
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Europe/Paris
    # Délai avant de proposer une version tout juste publiée : les PR étant fusionnées
    # automatiquement, cela laisse le temps de retirer une version compromise ou cassée.
    # Les mises à jour de sécurité ne sont pas concernées par ce délai.
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      # Ordre important : un artefact rejoint le premier groupe qui correspond.
      kotlinx:
        patterns: ["org.jetbrains.kotlinx*"]
      android-kotlin:
        patterns: ["androidx.*", "org.jetbrains.kotlin*", "com.android*"]
      network:
        patterns: ["com.squareup.okhttp3*"]
      google-cast:
        patterns: ["com.google.android.gms*"]
      test:
        patterns: ["junit*", "app.cash.turbine*"]
      # Tout le reste en une seule PR mensuelle.
      others:
        patterns: ["*"]

  # Versions des actions GitHub utilisées par la CI (épinglées par SHA).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: Europe/Paris
    cooldown:
      default-days: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
