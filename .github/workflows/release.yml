name: Release

# Construit l'APK et l'AAB signés (clé ECDSA P-256) ainsi que leur variante non signée,
# et les publie sur une release GitHub.
#
# Déclencheurs :
# - `push` d'un tag (`git tag v1.2.3 && git push origin v1.2.3`, « v » facultatif,
#   suffixe de pré-version accepté : 1.2.3-rc1) ;
# - `release: published` : une release créée depuis l'interface GitHub n'émet pas de
#   `push` de tag, sans cette entrée elle resterait sans artefact ;
# - `workflow_dispatch` : reprise manuelle d'un tag existant.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag à publier (ex. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version || github.ref_name }}
  cancel-in-progress: false

# Actions épinglées par SHA (le tag n'est qu'un commentaire, tenu à jour par Dependabot).
# La publication passe par la CLI `gh` préinstallée : aucune action tierce n'a accès
# au jeton en écriture.
jobs:
  release:
    name: Construire, signer et publier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Empreinte SHA-256 du certificat de release (ECDSA P-256, alias kodifin-release).
      # Publique : elle épingle la clé attendue. Un secret remplacé par erreur fait
      # échouer la release au lieu de publier un APK impossible à installer par-dessus
      # la version existante. À mettre à jour en cas de rotation de clé.
      EXPECTED_CERT_SHA256: 29730e29dba665b2df40777410ae50f51d25b5c925edd147272711e62054715d
    steps:
      # Un APK non signé ne s'installe pas : on échoue avant toute compilation.
      - name: Vérifier la présence des secrets de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets de signature manquants :$missing (voir README, section Release)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Historique complet : le versionCode est le nombre de commits.
          fetch-depth: 0
          persist-credentials: false
          # En reprise manuelle, `github.ref` est une branche : on force le tag demandé.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name || github.ref }}

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          # Pas d'écriture de cache depuis une release : seul main alimente le cache.
          cache-read-only: true

      - name: Déterminer la version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            release)           TAG="$RELEASE_TAG" ;;
            workflow_dispatch) TAG="$INPUT_TAG" ;;
            *)                 TAG="$GITHUB_REF_NAME" ;;
          esac
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag invalide : $TAG"
            exit 1
          fi
          # Un suffixe (« -rc1 ») désigne une pré-version ; sur l'évènement `release`,
          # la case cochée par l'auteur fait foi.
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            PRERELEASE="$RELEASE_PRERELEASE"
          elif [ "$VERSION" != "${VERSION%%-*}" ]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          # versionCode monotone : le nombre de commits ne peut que croître.
          VERSION_CODE="$(git rev-list --count HEAD)"
          {
            echo "tag=$TAG"
            echo "name=$VERSION"
            echo "code=$VERSION_CODE"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Tag $TAG -> version $VERSION (versionCode $VERSION_CODE, prerelease $PRERELEASE)"

      # On ne publie jamais une version qui ne passe pas les tests. L'APK debug (non
      # obfusqué) sert au contrôle anti-pistage des classes embarquées.
      - name: Tests unitaires, lint et APK debug
        run: ./gradlew test testDebugUnitTest lint assembleDebug --stacktrace

      - name: Aucune dépendance de pistage
        run: bash scripts/check-no-trackers.sh

      # Variante non signée (APK + AAB), construite avant la restauration du keystore :
      # aucun secret n'est accessible à cette étape. Utile pour une re-signature par un
      # tiers (F-Droid, magasin d'applications, clé propre) ou une vérification de
      # reproductibilité.
      - name: Construire l'APK et l'AAB non signés
        env:
          KODIFIN_VERSION_NAME: ${{ steps.version.outputs.name }}
          KODIFIN_VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          [ -f "$apk" ] && [ -f "$aab" ] || { echo "::error::Artefacts non signés introuvables"; exit 1; }
          # Garde-fou : ces artefacts ne doivent porter aucune signature.
          if "$APKSIGNER" verify "$apk" >/dev/null 2>&1; then echo "::error::$apk est signé"; exit 1; fi
          if keytool -printcert -jarfile "$aab" 2>/dev/null | grep -q 'SHA256:'; then echo "::error::$aab est signé"; exit 1; fi
          mkdir -p dist
          cp "$apk" "dist/kodifin-$VERSION-unsigned.apk"
          cp "$aab" "dist/kodifin-$VERSION-unsigned.aab"
          # Les sorties signées sont produites au même endroit : on repart d'un dossier vide
          # pour que la vérification de signature ne voie que les artefacts signés.
          rm -rf app/build/outputs/apk/release app/build/outputs/bundle/release

      - name: Restaurer le keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "path=$RUNNER_TEMP/release.p12" >> "$GITHUB_OUTPUT"

      - name: Construire l'APK et l'AAB signés
        env:
          KODIFIN_VERSION_NAME: ${{ steps.version.outputs.name }}
          KODIFIN_VERSION_CODE: ${{ steps.version.outputs.code }}
          KODIFIN_STORE_FILE: ${{ steps.keystore.outputs.path }}
          KODIFIN_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KODIFIN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KODIFIN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Effacer le keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      # Contrôle indépendant de Gradle : signature valide et certificat épinglé.
      - name: Vérifier la signature des artefacts
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          aabs=(app/build/outputs/bundle/release/*.aab)
          [ ${#apks[@]} -gt 0 ] && [ ${#aabs[@]} -gt 0 ] || { echo "::error::Artefacts introuvables"; exit 1; }
          for apk in "${apks[@]}"; do
            case "$apk" in *-unsigned.apk) echo "::error::APK non signé : $apk"; exit 1 ;; esac
            out="$("$APKSIGNER" verify --verbose --print-certs "$apk")"
            echo "$out" | grep -E "^Verified using|certificate DN|certificate SHA-256|key algorithm|key size"
            actual="$(echo "$out" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
            [ "$actual" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::$apk signé par $actual, attendu $EXPECTED_CERT_SHA256"; exit 1; }
          done
          for aab in "${aabs[@]}"; do
            actual="$(keytool -printcert -jarfile "$aab" | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
            [ "$actual" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::$aab signé par '$actual', attendu $EXPECTED_CERT_SHA256"; exit 1; }
            echo "$aab : certificat $actual"
          done

      - name: Préparer les artefacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/kodifin-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/kodifin-$VERSION.aab"
          cd dist && sha256sum ./* | sed 's# \./# #' > "kodifin-$VERSION.sha256" && cat "kodifin-$VERSION.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kodifin-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # Release existante (créée depuis l'interface) : on ajoute les fichiers sans toucher
      # aux notes. Sinon on la crée, avec des notes générées.
      - name: Publier sur la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--title "Kodifin $VERSION" --generate-notes --verify-tag)
            [ "$PRERELEASE" = true ] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
