name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Scan CVE quotidien même sans commit (nouvelles vulnérabilités publiées).
    - cron: "17 5 * * *"
  workflow_dispatch:

# Droits minimaux par défaut ; chaque job déclare ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Seules les PR annulent l'exécution précédente : sur main, un push ne doit pas
  # interrompre le scan quotidien ni la soumission du graphe de dépendances.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions épinglées par SHA (le tag n'est qu'un commentaire, tenu à jour par Dependabot).
jobs:
  build:
    name: Build, tests unitaires, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      # Valide aussi la somme de contrôle du gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Tests unitaires, lint et assemblage
        run: ./gradlew test testDebugUnitTest lint assembleDebug assembleRelease koverXmlReport koverHtmlReport --continue --stacktrace

      - name: Aucune dépendance de pistage
        run: bash scripts/check-no-trackers.sh

      - name: Badge de couverture
        run: bash scripts/coverage-badge.sh build/reports/kover/report.xml coverage.svg

      - name: Rapport et badge de couverture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            build/reports/kover/
            coverage.svg
          if-no-files-found: error
          retention-days: 14

      - name: Rapports de tests et de lint
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results-*.html
          retention-days: 14

      - name: APK de debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zapette-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Publie le badge sur main uniquement, et seulement s'il change. Job séparé : le build
  # reste en lecture seule, seul ce job (sans exécution de code du projet) peut écrire.
  # Le commit fait avec GITHUB_TOKEN ne relance pas la CI.
  coverage-badge:
    name: Publication du badge de couverture
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage

      - name: Commit du badge s'il a changé
        env:
          BADGE: ${{ runner.temp }}/coverage/coverage.svg
        run: |
          set -euo pipefail
          mkdir -p .github/badges
          cp "$BADGE" .github/badges/coverage.svg
          if git diff --quiet -- .github/badges/coverage.svg; then
            echo "Couverture inchangée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "Badge de couverture [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Impossible de publier le badge"
          exit 1

  vulnerabilities:
    name: Scan CVE des dépendances (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OSV_VERSION: v2.7.0
      # Empreinte du binaire osv-scanner_linux_amd64 publié pour OSV_VERSION
      # (osv-scanner_SHA256SUMS de la release) : à mettre à jour avec la version.
      OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Inventaire CycloneDX (SBOM)
        run: ./gradlew cyclonedxBom

      # Binaire téléchargé puis vérifié : un exécutable altéré ne doit jamais être lancé.
      - name: Installer OSV-Scanner
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner

      - name: Scan des vulnérabilités connues
        run: ./osv-scanner scan source --lockfile build/reports/cyclonedx/bom.json --format table

      - name: SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: build/reports/cyclonedx/bom.json
          retention-days: 30

  dependency-graph:
    name: Graphe de dépendances (alertes Dependabot)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # contents: write est requis par l'API de soumission du graphe de dépendances.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      # Publie les dépendances transitives résolues par Gradle : Dependabot peut ainsi
      # signaler les CVE de toutes les bibliothèques, pas seulement celles déclarées.
      # Périmètre : bibliothèques embarquées (les classpaths de plugins/outillage sont exclus,
      # ils ne sont pas livrés dans l'APK et sont mis à jour via Dependabot de toute façon).
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          dependency-graph-include-configurations: '.*[Rr]untimeClasspath'
