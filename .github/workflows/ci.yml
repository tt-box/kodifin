name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Scan CVE hebdomadaire même sans commit (nouvelles vulnérabilités publiées), comme
    # gabuzomeu et geoPing.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Droits minimaux par défaut ; chaque job déclare ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Seules les PR annulent l'exécution précédente : sur main, un push ne doit pas
  # interrompre le scan hebdomadaire ni la publication des badges.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions épinglées par SHA (le tag n'est qu'un commentaire, tenu à jour par Dependabot).
# Le graphe de dépendances (alertes Dependabot) est dans dependency-graph.yml : il ne
# tourne que quand les dépendances changent.
jobs:
  # Un commit qui ne touche que la documentation ne relance ni Gradle ni le scan CVE. Pas
  # de `paths-ignore` au niveau du workflow : si ces jobs sont des checks requis, un
  # workflow non déclenché laisserait la PR « en attente » ; un job sauté par `if:` compte
  # comme réussi. Cron, déclenchement manuel ou base introuvable : tout tourne.
  changes:
    name: Détection des changements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Le commit touche-t-il autre chose que la documentation ?
        id: diff
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$BASE_PR" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
              || ! files="$(git diff --name-only "$base...$GITHUB_SHA" 2>/dev/null)"; then
            echo "Pas de base de comparaison : CI complète."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          # Documentation : docs/, tout *.md, cartes graft, badges.
          if echo "$files" | grep -qvE '^(docs/|graft/|\.github/badges/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Documentation seule : build et scan sautés."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, tests unitaires, lint
    needs: changes
    # Le cron hebdomadaire ne sert qu'au scan CVE : le code n'a pas changé depuis le dernier
    # push, inutile de tout reconstruire.
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      # Valide aussi la somme de contrôle du gradle-wrapper.jar. La clé chiffre le cache de
      # configuration Gradle (qui peut contenir des secrets) : sans elle (PR de fork ou
      # Dependabot), il n'est simplement pas sauvegardé.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # koverVerify : échoue sous 80 % de couverture des lignes (seuil du build.gradle.kts racine).
      - name: Tests unitaires, lint, assemblage et seuil de couverture
        run: ./gradlew test testDebugUnitTest lint assembleDebug assembleRelease koverXmlReport koverHtmlReport koverVerify --continue --stacktrace

      - name: Aucune dépendance de pistage
        run: bash scripts/check-no-trackers.sh

      - name: Badge de couverture
        run: bash scripts/coverage-badge.sh build/reports/kover/report.xml coverage.svg

      - name: Rapport et badge de couverture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            build/reports/kover/
            coverage.svg
          if-no-files-found: error
          retention-days: 14

      - name: Rapports de tests et de lint
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results-*.html
          retention-days: 14

      - name: APK de debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kodifin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Publie le badge sur main uniquement, et seulement s'il change. Job séparé : le build
  # reste en lecture seule, seul ce job (sans exécution de code du projet) peut écrire.
  # Le commit fait avec GITHUB_TOKEN ne relance pas la CI.
  coverage-badge:
    name: Publication du badge de couverture
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Même groupe que le badge CVE : une seule écriture à la fois sur main.
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage

      - name: Commit du badge s'il a changé
        env:
          BADGE: ${{ runner.temp }}/coverage/coverage.svg
        run: |
          set -euo pipefail
          mkdir -p .github/badges
          cp "$BADGE" .github/badges/coverage.svg
          if git diff --quiet -- .github/badges/coverage.svg; then
            echo "Couverture inchangée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git commit -m "Badge de couverture [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Impossible de publier le badge"
          exit 1

  vulnerabilities:
    name: Scan CVE des dépendances (OSV)
    needs: changes
    # Cron : toujours (nouvelles CVE publiées) ; sinon seulement si autre chose que la doc change.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      count: ${{ steps.scan.outputs.count }}
    env:
      OSV_VERSION: v2.7.0
      # Empreinte du binaire osv-scanner_linux_amd64 publié pour OSV_VERSION
      # (osv-scanner_SHA256SUMS de la release) : à mettre à jour avec la version.
      OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Inventaire CycloneDX (SBOM)
        run: ./gradlew cyclonedxBom

      # Binaire téléchargé puis vérifié : un exécutable altéré ne doit jamais être lancé.
      - name: Installer OSV-Scanner
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner

      # OSV-Scanner sort en 1 s'il trouve une vulnérabilité, autre chose s'il plante. On
      # compte d'abord (pour le badge), le job n'échoue qu'à la dernière étape. Nombre de
      # vulnérabilités distinctes : OSV regroupe sous un même « group » les identifiants
      # alias d'une même faille (CVE, GHSA…), on compte donc les groupes.
      - name: Scan des vulnérabilités connues
        id: scan
        run: |
          set -uo pipefail
          ./osv-scanner scan source --lockfile build/reports/cyclonedx/bom.json \
            --format json --output osv-results.json
          rc=$?
          if [ "$rc" -gt 1 ] || [ ! -s osv-results.json ]; then
            # Ni rapport ni succès : le scanner a planté. Afficher « 0 » serait mentir.
            echo "::error::OSV-Scanner a échoué (code $rc) sans produire de rapport"
            exit 1
          fi
          n="$(jq '[.results[]?.packages[]?.groups[]?] | length' osv-results.json)"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Vulnérabilités distinctes : $n"
          if [ "$n" -gt 0 ]; then
            jq -r '.results[]?.packages[]? | "\(.package.name) \(.package.version) : \([.groups[]?.ids[0]] | join(", "))"' osv-results.json
          fi

      - name: SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: build/reports/cyclonedx/bom.json
          retention-days: 30

      - name: Résultats OSV
        if: always() && hashFiles('osv-results.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: osv-results
          path: osv-results.json
          retention-days: 30

      # Une PR vulnérable reste bloquée : le job échoue après le comptage et les artefacts.
      - name: Échouer si des vulnérabilités sont connues
        env:
          COUNT: ${{ steps.scan.outputs.count }}
        run: |
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$COUNT vulnérabilité(s) connue(s) — détail dans l'étape « Scan des vulnérabilités connues »"
            exit 1
          fi

  # Badge « CVE » du README (.github/badges/cve.svg), commité sur main s'il change. Job
  # séparé : le scan garde un jeton en lecture seule. Jamais sur une PR : le badge reflète
  # main. Publié même (surtout) quand le scan a échoué sur des vulnérabilités.
  cve-badge:
    name: Publication du badge CVE
    needs: vulnerabilities
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.vulnerabilities.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Commit du badge s'il a changé
        env:
          COUNT: ${{ needs.vulnerabilities.outputs.count }}
        run: |
          set -euo pipefail
          bash scripts/cve-badge.sh "$COUNT" .github/badges/cve.svg
          if [ -z "$(git status --porcelain -- .github/badges/cve.svg)" ]; then
            echo "Badge CVE inchangé ($COUNT)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/cve.svg
          git commit -m "Badge CVE : $COUNT [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::Impossible de publier le badge"
          exit 1
